name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # The engine and its self checks build anywhere. No EPROM image is needed: the checks that want one
  # skip themselves.
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build/cmake -S . -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/cmake --config Release
      - name: Test
        run: ctest --test-dir build/cmake -C Release --output-on-failure
      - name: Upload console
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: FSVR-console-windows
          path: bin/fsvr_console.exe
          if-no-files-found: error

  # The plug-in: Hollow (hollow/) with the FSVR skin (plugin/skin), every format the platform has, collected
  # in bin/<format> by the build. The first configure downloads the CLAP and VST3 SDKs, clap-wrapper,
  # RtAudio, RtMidi and the audio decoders; the plug-in's own checks (check_plugin, check_gui) run on each 64-bit leg.
  plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            configure: -A x64
          - os: windows-latest
            name: windows-x86
            configure: -A Win32
          - os: ubuntu-latest
            name: linux
            configure: -DCMAKE_BUILD_TYPE=Release
          - os: macos-latest
            name: macos
            configure: -DCMAKE_BUILD_TYPE=Release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The editor is an X11 window; the standalone's audio and MIDI are RtAudio's ALSA, JACK and
      # PulseAudio backends and RtMidi's ALSA one, each built only when its headers are there.
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libasound2-dev libjack-jackd2-dev libpulse-dev pkg-config
      # The About box credits the repository's contributors as GitHub lists them when the build runs.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contributors
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/contributors.py ${{ github.repository }}
      - name: Configure
        run: cmake -B build/plugin -S . -DFSVR_BUILD_PLUGIN=ON ${{ matrix.configure }}
      - name: Build
        run: cmake --build build/plugin --config Release
      # check_plugin and check_gui drive the processor and its editor with the worker running on its own
      # thread, and a check that reads the worker's result without polling can miss it on a loaded runner
      # (the InitEP, bank-dialog and saved-sound failures that come and go on main, on legs the same code
      # passes elsewhere). Three tries: a flake passes a rerun, a real regression fails all three.
      - name: Test
        if: matrix.name != 'windows-x86'
        run: ctest --test-dir build/plugin -C Release -R "plugin|gui" --output-on-failure --repeat until-pass:3
      # Zipped here rather than in the release job, because an Actions artifact does not carry the
      # executable bit: bin/ uploaded as loose files comes back 644, and a macOS bundle whose
      # Contents/MacOS file is not executable fails to launch with "The application FSVR can't be
      # opened". A zip records the mode, and the artifact is then that one file, so a download off a
      # plain Actions run is as usable as a release asset. -y keeps the bundles' symlinks as symlinks.
      # Only the plug-in folders go in: the console and render_capture are the engine job's.
      - name: Zip
        if: runner.os != 'Windows'
        run: cd bin && zip -ry ../FSVR-plugin-${{ matrix.name }}.zip $(ls -d CLAP VST3 VST2 AU Standalone 2>/dev/null)
      - name: Zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dirs = 'CLAP', 'VST3', 'VST2', 'VST2 32-bit and DXi', 'Standalone' | Where-Object { Test-Path "bin/$_" } | ForEach-Object { "bin/$_" }
          Compress-Archive -Path $dirs -DestinationPath FSVR-plugin-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FSVR-plugin-${{ matrix.name }}
          path: FSVR-plugin-${{ matrix.name }}.zip
          if-no-files-found: error

  # The installers, from musicastudio/Installer (the engine) with the plug-in artifacts above as their
  # payloads, all three built on Linux: Windows and macOS cross-compile, Linux needs cgo and X11. The
  # version is FSVR's own, out of CMakeLists.txt, and a tag that disagrees with it fails here. The
  # installer's licensed font comes from the INSTALLER_FONT secret, payload/font.bin in base64, already
  # cut and scrambled by the Installer's build.sh; without it the installers draw in Go Mono.
  installer:
    needs: plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: musicastudio/Installer
          path: installer
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev
      - uses: actions/download-artifact@v4
        with:
          pattern: FSVR-plugin-*
          path: plugin
      # Windows x64 and x86 go into one folder, the layout of a local bin/.
      - name: Payloads
        run: |
          for p in windows windows-x86 macos linux; do unzip -qo "plugin/FSVR-plugin-$p/FSVR-plugin-$p.zip" -d "bin-${p%-x86}"; done
      - name: Build
        env:
          INSTALLER_FONT: ${{ secrets.INSTALLER_FONT }}
        run: |
          v=$(sed -n 's/^project(fsvr VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then echo "tag $GITHUB_REF_NAME, but CMakeLists.txt says $v"; exit 1; fi
          if [ -n "$INSTALLER_FONT" ]; then echo "$INSTALLER_FONT" | base64 -d > installer/payload/font.bin; fi
          cp icon.png installer/product/icon.png   # the setup's own icon and its Linux menu entry's: FSVR's
          VERSION=$v BIN_WINDOWS=$PWD/bin-windows BIN_MACOS=$PWD/bin-macos BIN_LINUX=$PWD/bin-linux installer/build.sh
          cd installer/dist && zip -qry FSVR-MacOS-Installer.zip FSVR-MacOS-Installer.app && rm -r FSVR-MacOS-Installer.app && ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: FSVR-installers
          path: installer/dist/*
          if-no-files-found: error

  release:
    needs: [engine, plugin, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release body is the annotated tag's message (AGENTS.md, "Releases"). generate_release_notes
      # alone left v0.4.6 with nothing but a compare link, and actions/checkout peels a tag ref to its
      # commit, which handed v0.4.7 the commit message, so the tag object is read off the API instead.
      # A lightweight tag has no tag object and fails here on purpose. The Download table of the three
      # installers goes above it, as v0.5.0's was written by hand, its links on this tag.
      - name: Release notes from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq .object.sha)
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/$sha" --jq .message > tag.md && test -s tag.md
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          {
            echo "## Download"
            echo
            echo "| | Installer | |"
            echo "|---|---|---|"
            echo "| **Windows** | [FSVR-Windows-Installer.exe]($url/FSVR-Windows-Installer.exe) | Run it; it asks for admin rights to install into Program Files |"
            echo "| **macOS** | [FSVR-MacOS-Installer.zip]($url/FSVR-MacOS-Installer.zip) | Unzip and open FSVR-MacOS-Installer; it is not signed, so right-click it and choose Open the first time |"
            echo "| **Linux** | [FSVR-Linux-Installer]($url/FSVR-Linux-Installer) | \`chmod +x FSVR-Linux-Installer\`, then run it |"
            echo
            echo "The installer puts every format in place (VST3, CLAP, VST2, the 32-bit VST2 with its DXi, AU and the standalone) and can keep FSVR up to date. To install one format by hand instead, take its own zip from the list below, \`FSVR-<OS>-<format>.zip\`. \`FSVR-MacOS-Update\` is for the updater, not for downloading."
            echo
            echo "---"
            echo
            cat tag.md
          } > notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # One zip per format, named as FM8.plus names its assets: FSVR-<OS>-<format>.zip, each holding
      # just that format's files, so FSVR-Windows-VST3.zip opens onto FSVR.vst3. The 64-bit Windows VST2
      # is VST2-64 beside the 32-bit VST2-32-DXi, which carries the DXi in the same DLL. The installers
      # and the console go up as they are, with SHA256SUMS.txt over the lot.
      - name: Release files
        run: |
          out=$PWD/release && mkdir -p "$out"
          split() { # split <artifact> <OS>
            rm -rf x && mkdir x && unzip -q "artifacts/FSVR-plugin-$1/FSVR-plugin-$1.zip" -d x
            for d in x/*/; do
              f=$(basename "$d")
              case "$f/$2" in "VST2 32-bit and DXi/"*) f=VST2-32-DXi ;; VST2/Windows) f=VST2-64 ;; esac
              (cd "$d" && zip -qry "$out/FSVR-$2-$f.zip" .)
            done
          }
          split windows Windows && split windows-x86 Windows && split macos MacOS && split linux Linux
          (cd artifacts/FSVR-console-windows && zip -q "$out/FSVR-Windows-Console.zip" fsvr_console.exe)
          cp artifacts/FSVR-installers/* "$out/"
          cd "$out" && sha256sum * > SHA256SUMS.txt && ls -l
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          body_path: notes.md
